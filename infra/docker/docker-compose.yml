# MD AI — local/production compose topology.
# See docs/architecture/08-deployment-architecture.md for the resource
# budget and networking modes this file implements.
#
# Run from the repo root: `docker compose -f infra/docker/docker-compose.yml up`
# (the backend build context is the repo root, since it needs
# pnpm-workspace.yaml and packages/shared-types alongside services/backend).

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mdai
      POSTGRES_PASSWORD: mdai
      POSTGRES_DB: mdai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      platforms: ["linux/arm64"]
    restart: unless-stopped
    env_file: ../../services/backend/.env
    environment:
      DATABASE_URL: postgres://mdai:mdai@postgres:5432/mdai
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  redis-data:
