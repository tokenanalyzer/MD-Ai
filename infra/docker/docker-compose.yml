# MD AI — local/production compose topology.
# See docs/architecture/08-deployment-architecture.md for the resource
# budget and networking modes this file implements.
#
# Run from the repo root: `docker compose -f infra/docker/docker-compose.yml up`
# (the backend build context is the repo root, since it needs
# pnpm-workspace.yaml and packages/shared-types alongside services/backend).

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mdai
      POSTGRES_PASSWORD: mdai
      POSTGRES_DB: mdai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      platforms: ["linux/arm64"]
    restart: unless-stopped
    env_file: ../../services/backend/.env
    environment:
      DATABASE_URL: postgres://mdai:mdai@postgres:5432/mdai
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

  # M10: optional automation engine — see infra/n8n/README.md and
  # docs/architecture/08-deployment-architecture.md §7. Never started by
  # `docker compose up` on its own; requires `--profile automation`
  # (`docker compose -f infra/docker/docker-compose.yml --profile automation up`).
  # MD AI's own `automations` table (`action_type = 'n8n_workflow'`) calls
  # this service's webhook URLs; n8n workflows call back into MD AI via
  # `POST /webhooks/automations/:slug`. Neither service depends on the
  # other being present or running.
  n8n:
    image: n8nio/n8n:latest
    profiles: ["automation"]
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"

volumes:
  postgres-data:
  redis-data:
  n8n-data:
