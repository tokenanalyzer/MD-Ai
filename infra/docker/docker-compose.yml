# MD AI — local/production compose topology.
# See docs/architecture/08-deployment-architecture.md for the resource
# budget and networking modes this file implements.
#
# `backend` build context is added in Phase 7 once services/backend has a
# Dockerfile; until then `docker compose up postgres redis` is enough to
# develop the backend locally against a real DB.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mdai
      POSTGRES_PASSWORD: mdai
      POSTGRES_DB: mdai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

  # backend:
  #   build:
  #     context: ../../services/backend
  #     dockerfile: ../../infra/docker/backend.Dockerfile
  #     platforms: ["linux/arm64"]
  #   restart: unless-stopped
  #   env_file: ../../services/backend/.env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started
  #   ports:
  #     - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  redis-data:
